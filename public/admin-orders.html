<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Заказы — kassa-cto.ru</title>
<style>
:root {
  --bg: #f0f2f5;
  --card: #ffffff;
  --primary: #163A5F;
  --primary-hover: #1E4A78;
  --accent: #f59e0b;
  --success: #16a34a;
  --danger: #dc2626;
  --warning: #b45309;
  --info: #0284c7;
  --text: #111827;
  --text-soft: #6b7280;
  --border: #e5e7eb;
  --border-soft: #f3f4f6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
}
header {
  background: var(--primary);
  color: #fff;
  padding: 0;
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
}
header .header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  padding: 12px 20px;
  gap: 16px;
}
header h1 { font-size: 18px; font-weight: 600; }
header .brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: #fff;
  flex-shrink: 0;
}
header .brand img {
  height: 36px;
  width: auto;
  border-radius: 6px;
  background: #fff;
  padding: 4px;
}
header .brand .brand-text { display: flex; flex-direction: column; }
header .brand .brand-text strong {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
header .brand .brand-text small {
  font-size: 10px;
  font-weight: 500;
  color: rgba(255,255,255,.55);
  text-transform: uppercase;
  letter-spacing: .8px;
  margin-top: 1px;
}
header .actions { display: flex; gap: 8px; align-items: center; }
header .actions button,
header .actions .btn-link {
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.15);
  color: #fff;
  padding: 9px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all .15s ease;
  white-space: nowrap;
}
header .actions button:hover,
header .actions .btn-link:hover {
  background: rgba(255,255,255,.2);
  border-color: rgba(255,255,255,.3);
}
header .actions button:active {
  transform: scale(0.97);
}
header .actions .btn-label { display: inline; }

.filters {
  background: var(--card);
  padding: 14px 24px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
}
.filters input, .filters select {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
}
.filters input { flex: 1; min-width: 200px; }
.filters select { min-width: 140px; }
.filters input:focus, .filters select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(30,58,95,.1);
}

main { max-width: 1400px; margin: 0 auto; padding: 20px 24px; }

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.stat {
  background: var(--card);
  padding: 14px 16px;
  border-radius: 8px;
  border-left: 4px solid var(--primary);
}
.stat .label { font-size: 11px; color: var(--text-soft); text-transform: uppercase; letter-spacing: .5px; }
.stat .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
.stat.success { border-color: var(--success); }
.stat.warning { border-color: var(--warning); }
.stat.info { border-color: var(--info); }

.orders-list { display: flex; flex-direction: column; gap: 10px; }
.order {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: box-shadow .2s ease, transform .2s ease;
}
.order:hover { box-shadow: 0 10px 30px rgba(0,0,0,.06); }
.order-header {
  padding: 14px 18px;
  display: grid;
  grid-template-columns: 110px 1fr 180px 130px 100px 40px;
  gap: 14px;
  align-items: center;
  cursor: pointer;
  user-select: none;
}
.order-header:hover { background: var(--border-soft); }
.order-num {
  font-weight: 700;
  color: var(--primary);
  font-size: 13px;
}
.order-client { font-weight: 600; font-size: 14px; }
.order-client small { display: block; color: var(--text-soft); font-weight: 400; font-size: 12px; margin-top: 2px; }
.order-kkm { font-size: 13px; color: var(--text); }
.order-kkm small { display: block; color: var(--text-soft); font-size: 11px; }
.order-total { font-weight: 600; color: var(--primary); text-align: right; font-size: 15px; }
.order-status {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  text-align: center;
  white-space: nowrap;
}

/* ─── МОБИЛЬНАЯ ВЕРСИЯ CRM (< 768px) ─── */
@media (max-width: 767px) {
  /* Header */
  header .header-inner { padding: 10px 14px; gap: 8px; }
  header .brand img { height: 32px; }
  header .brand .brand-text strong { font-size: 13px; }
  header .brand .brand-text small { font-size: 9px; }
  header .actions { gap: 6px; }
  header .actions button,
  header .actions .btn-link {
    padding: 9px 11px;
    font-size: 13px;
  }
  /* На мобильном — только иконки, без текста */
  header .actions .btn-label { display: none; }

  /* Filters */
  .filters { padding: 10px 16px; gap: 8px; }
  .filters input { font-size: 14px; padding: 10px 12px; min-width: 0; }
  .filters select { font-size: 14px; padding: 10px 12px; min-width: 0; }

  /* Stats */
  .stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  main { padding: 12px 12px; }
  .stat { padding: 10px 12px; }
  .stat .value { font-size: 18px; }
  .stat .label { font-size: 10px; }

  /* Карточка заказа — вертикальная компоновка */
  .order-header {
    grid-template-columns: 1fr auto;
    grid-template-rows: auto auto auto;
    gap: 6px 12px;
    padding: 12px 14px;
    align-items: start;
  }
  .order-num {
    grid-column: 1;
    grid-row: 1;
    font-size: 13px;
  }
  .order-toggle {
    grid-column: 2;
    grid-row: 1 / 4;
    align-self: start;
    width: 28px;
    height: 28px;
    font-size: 14px;
  }
  .order-client {
    grid-column: 1;
    grid-row: 2;
    font-size: 15px;
  }
  .order-client small {
    font-size: 12px;
    margin-top: 3px;
  }
  .order-services-preview {
    grid-column: 1;
    grid-row: 3;
    margin-top: 4px;
  }
  .order-services-preview .service-chip {
    font-size: 10px;
    padding: 2px 6px;
    max-width: 100%;
  }
  /* Скрываем колонки ККМ и суммы на мобильном — они в превью услуг */
  .order-header > .order-kkm,
  .order-header > .order-total,
  .order-header > .order-status { display: none; }

  /* Статус в виде inline-бейджа на мобильном */
  .order-status-mobile {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    margin-top: 4px;
  }

  /* Мобильная мета-строка: статус + ККМ + сумма */
  .order-mobile-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  .order-mobile-kkm {
    font-size: 11px;
    color: var(--text-soft);
    background: var(--border-soft);
    padding: 2px 8px;
    border-radius: 6px;
  }
  .order-mobile-total {
    font-size: 13px;
    font-weight: 700;
    color: var(--primary);
    margin-left: auto;
  }

  /* Развёрнутая карточка */
  .order-details { padding: 0; }
  .details-grid {
    grid-template-columns: 1fr;
    gap: 12px;
    padding: 14px;
  }
  .services-block { margin: 0 14px 12px; }
  .services-block .body { padding: 10px 12px; }
  .services-list li { font-size: 12px; padding: 6px 8px; }

  /* Воронка менеджера на мобильном */
  .funnel-checklist li { padding: 10px 12px; }
  .funnel-checklist .funnel-step-title { font-size: 13px; }
  .funnel-checklist .check-label small { font-size: 11px; }

  /* Actions row */
  .actions-row {
    padding: 10px 14px;
    flex-direction: column;
    gap: 8px;
  }
  .actions-row .btn,
  .actions-row .note-input {
    width: 100%;
    justify-content: center;
  }
  .actions-row .btn { font-size: 13px; padding: 10px 14px; }

  /* Инженерная панель */
  .order-details > .panel.engineer { margin: 0 14px 14px; }

  /* kv пары */
  .kv { grid-template-columns: 100px 1fr; gap: 6px 10px; font-size: 12px; }
  .kv .k { font-size: 11px; }
  .kv .v { font-size: 12px; }

  /* Панели */
  .panel h3 { font-size: 11px; padding: 8px 12px; }
  .panel .body { padding: 10px 12px; }

  /* Collapsible-toggle */
  .collapsible-toggle { padding: 8px 12px; font-size: 11px; }

  /* Toast */
  .toast { left: 12px; right: 12px; bottom: 12px; text-align: center; font-size: 12px; }

  /* Login */
  .login-box { padding: 20px 18px; max-width: 100%; }
  .login-box h1 { font-size: 18px; }
  .login-box input { font-size: 16px; padding: 12px 14px; }
  .login-box button { padding: 14px; font-size: 15px; }

  /* Empty state */
  .empty { padding: 40px 16px; }
  .empty h2 { font-size: 16px; }
}
/* Статусы — новая палитра по требованиям арт-директора */
.status-Новый { background: #DBEAFE; color: #2563EB; }
.status-В работе { background: #FEF3C7; color: #F59E0B; }
.status-Ожидает { background: #F3E8FF; color: #9333EA; }
.status-Готово { background: #DCFCE7; color: #16A34A; }
.status-Закрыт { background: #E5E7EB; color: #64748B; }
.status-Отказ { background: #FEE2E2; color: #DC2626; }

/* ─── Воронка статусов ─── */
.funnel {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
  padding: 12px 14px;
  background: linear-gradient(to right, #f8fafc, #f1f5f9);
  border-radius: 8px;
  border: 1px solid var(--border);
}
.funnel-step {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: #fff;
  color: var(--text-soft);
  cursor: pointer;
  transition: all .12s;
  white-space: nowrap;
}
.funnel-step:hover { border-color: var(--primary); color: var(--primary); }
.funnel-step.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}
.funnel-step.done {
  background: #dcfce7;
  color: #166534;
  border-color: #86efac;
}
.funnel-step.done::before { content: '✓ '; }
.funnel-step.rejected {
  background: #fee2e2;
  color: #991b1b;
  border-color: #fca5a5;
}
.funnel-arrow { color: var(--text-soft); align-self: center; font-size: 14px; }
.funnel-label {
  font-size: 11px;
  color: var(--text-soft);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 8px;
  font-weight: 600;
}

/* ─── Сворачиваемая панель инженера ─── */
.collapsible-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
  padding: 10px 14px;
  background: var(--warning);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.collapsible-toggle:hover { background: #92400e; }
.collapsible-toggle .toggle-icon { transition: transform .15s; font-size: 14px; }
.collapsible.expanded .toggle-icon { transform: rotate(180deg); }
.collapsible-content { display: none; }
.collapsible.expanded .collapsible-content { display: block; }
.order-toggle {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-soft);
  transition: transform .15s;
  font-size: 16px;
}
.order.expanded .order-toggle { transform: rotate(90deg); }

/* Мобильная мета — скрыта на десктопе, видна только на мобиле */
.order-mobile-meta { display: none; }
@media (max-width: 767px) {
  .order-mobile-meta { display: flex; }
}

/* ─── Превью услуг в списке заказов ─── */
.order-services-preview {
  font-size: 10px;
  color: var(--text-soft);
  margin-top: 3px;
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  max-width: 100%;
  overflow: hidden;
  max-height: 18px;
  line-height: 1.2;
}
.order-services-preview .service-chip {
  display: inline-block;
  padding: 1px 5px;
  background: #e0e7ff;
  color: #163A5F;
  border-radius: 3px;
  font-size: 9px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 130px;
}
.order-services-preview .service-more {
  color: var(--text-soft);
  font-style: italic;
  font-size: 9px;
  white-space: nowrap;
}

/* ─── Отдельная секция услуг в развёрнутой карточке ─── */
.services-block {
  margin: 0 18px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.services-block h3 {
  padding: 10px 14px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  background: #0f766e;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.services-block h3 .count {
  background: rgba(255,255,255,.2);
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
}
.services-block .body { padding: 12px 14px; }
.services-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.services-list li {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 7px 10px;
  background: #f0fdfa;
  border-left: 3px solid #14b8a6;
  border-radius: 4px;
  font-size: 13px;
  line-height: 1.4;
  color: #134e4a;
}
.services-list li::before {
  content: '▸';
  color: #14b8a6;
  font-weight: 700;
  flex-shrink: 0;
  margin-top: 1px;
}

.order-details {
  display: none;
  border-top: 1px solid var(--border);
  background: #fafbfc;
}
.order.expanded .order-details { display: block; }

.details-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  padding: 18px;
  max-width: 100%;
  box-sizing: border-box;
}
@media (max-width: 900px) and (min-width: 768px) {
  .details-grid { grid-template-columns: 1fr; }
}
.panel { min-width: 0; max-width: 100%; box-sizing: border-box; }
.panel .body { min-width: 0; }
.kv { min-width: 0; }

/* Панель инженера внизу карточки — на всю ширину */
.order-details > .panel.engineer {
  margin: 0 18px 18px;
}

.panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.panel h3 {
  padding: 10px 14px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  background: var(--primary);
  color: #fff;
}
.panel.engineer h3 { background: var(--warning); }
.panel.manager h3 { background: var(--primary); }
.panel .body { padding: 12px 14px; }

.kv {
  display: grid;
  grid-template-columns: 130px 1fr;
  gap: 8px 12px;
  font-size: 13px;
}
.kv .k { color: var(--text-soft); }
.kv .v { font-weight: 500; word-break: break-word; }
.kv .v a { color: var(--primary); text-decoration: none; }
.kv .v a:hover { text-decoration: underline; }

.checklist {
  list-style: none;
  margin-top: 8px;
  margin: 8px -14px 0;
}
.checklist li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 14px;
  border-bottom: 1px dashed var(--border);
  font-size: 13px;
}
.checklist li:last-child { border-bottom: none; }
.checklist li:hover { background: var(--border-soft); }
.checklist input[type=checkbox] {
  width: 18px;
  height: 18px;
  margin-top: 1px;
  cursor: pointer;
  accent-color: var(--success);
  flex-shrink: 0;
}
.checklist .check-label { flex: 1; line-height: 1.4; cursor: pointer; user-select: none; }
.checklist .check-label small { display: block; color: var(--text-soft); font-size: 11px; margin-top: 2px; }
.checklist li.done { opacity: .55; }
.checklist li.done .check-label { text-decoration: line-through; }

/* ─── Воронка менеджера (funnel-checklist) ─── */
.funnel-checklist li {
  flex-direction: row;
  align-items: flex-start;
  border-left: 3px solid var(--border);
  background: #fff;
  padding: 10px 14px;
}
.funnel-checklist li.done {
  border-left-color: var(--success);
  background: #f0fdf4;
}
.funnel-checklist li.current {
  border-left-color: var(--primary);
  background: #eff6ff;
}
.funnel-checklist .funnel-step-title {
  font-weight: 600;
  color: #111;
  font-size: 14px;
}
.funnel-status-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  color: var(--text-soft);
  background: #f3f4f6;
  padding: 2px 8px;
  border-radius: 8px;
  margin-left: 4px;
  vertical-align: middle;
}
.funnel-status-badge.current {
  color: var(--primary);
  background: #dbeafe;
}
.funnel-checklist .check-label small {
  color: #6b7280;
  font-size: 11px;
  margin-top: 3px;
}

.actions-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding: 12px 14px;
  border-top: 1px solid var(--border);
  background: var(--border-soft);
}
.btn {
  padding: 7px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: #fff;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:hover { background: var(--border-soft); }
.btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn.primary:hover { background: var(--primary-hover); }
.btn.success { background: var(--success); color: #fff; border-color: var(--success); }
.btn.danger { background: #fff; color: var(--danger); border-color: var(--danger); }
.btn.danger:hover { background: var(--danger); color: #fff; }
.btn.warning { background: var(--warning); color: #fff; border-color: var(--warning); }

.status-select {
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  font-size: 13px;
  font-family: inherit;
  background: #fff;
}
.status-select:focus { outline: none; border-color: var(--primary); }

.note-input {
  flex: 1;
  min-width: 200px;
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  font-size: 13px;
  font-family: inherit;
}
.note-input:focus { outline: none; border-color: var(--primary); }

.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-soft);
}
.empty h2 { font-size: 18px; margin-bottom: 8px; color: var(--text); }

.loading {
  text-align: center;
  padding: 40px;
  color: var(--text-soft);
}
.spinner {
  display: inline-block;
  width: 28px;
  height: 28px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 12px 18px;
  border-radius: 8px;
  background: var(--text);
  color: #fff;
  font-size: 13px;
  box-shadow: 0 4px 12px rgba(0,0,0,.2);
  z-index: 1000;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }

/* Логин форма */
.login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}
.login-box {
  background: var(--card);
  padding: 28px 32px;
  border-radius: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,.08);
  max-width: 380px;
  width: 100%;
}
.login-box h1 { color: var(--primary); margin-bottom: 6px; font-size: 22px; }
.login-box p { color: var(--text-soft); font-size: 13px; margin-bottom: 20px; }
.login-box label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
.login-box input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 14px;
  margin-bottom: 14px;
  font-family: inherit;
}
.login-box input:focus { outline: none; border-color: var(--primary); }
.login-box .captcha {
  background: var(--border-soft);
  padding: 10px 14px;
  border-radius: 6px;
  margin-bottom: 14px;
  font-weight: 600;
}
.login-box button {
  width: 100%;
  padding: 12px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.login-box button:hover { background: var(--primary-hover); }
.login-box button:disabled { opacity: .6; cursor: not-allowed; }
.login-error { color: var(--danger); font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>

<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
// ════════════════════════════════════════════════════════════════
// КОНФИГ
// ════════════════════════════════════════════════════════════════
const API_BASE = '/api';

// ─── Чек-лист МЕНЕДЖЕРА: привязан к воронке статусов 1-в-1 ────────
// Каждый этап = один статус. При отметке этапа — статус меняется автоматически.
// При снятии — откатывается назад.
const MANAGER_CHECKLIST = [
  {
    id: 'm_new',
    label: 'Принять заявку',
    hint: 'Заявка получена с сайта/телефона, контакты проверены',
    status: 'Новый',
    icon: '📌',
  },
  {
    id: 'm_in_progress',
    label: 'Связаться и уточнить задачу',
    hint: 'Позвонить за 30 мин, выяснить что нужно: маркировка/ремонт/ФН/ТО. Согласовать смету и допы',
    status: 'В работе',
    icon: '🔧',
  },
  {
    id: 'm_waiting',
    label: 'Ожидание оплаты / согласования',
    hint: 'Счёт выставлен, ждём оплату или решение клиента. Запчасти/ФН в заказе',
    status: 'Ожидает',
    icon: '⏳',
  },
  {
    id: 'm_done',
    label: 'Работы выполнены',
    hint: 'Инженер закончил, касса работает. Согласовать сдачу с клиентом',
    status: 'Готово',
    icon: '✅',
  },
  {
    id: 'm_closed',
    label: 'Закрыть сделку',
    hint: 'Акт подписан, оплата получена, документы в деле',
    status: 'Закрыт',
    icon: '📦',
  },
];

// ─── Чек-лист ИНЖЕНЕРА: 5 ключевых этапов технических работ ────
const ENGINEER_CHECKLIST = [
  { id: 'e_prepare',  label: 'Подготовка кассы и проверка состояния', hint: 'Включить, проверить ККМ, ФН (срок, остаток), версию прошивки (ФФД 1.2+)' },
  { id: 'e_setup',    label: 'Установить/настроить компоненты',       hint: 'ФН, ОФД, ЭДО, криптопровайдер, ТС ПИоТ, 2D-сканер — что нужно под задачу' },
  { id: 'e_register', label: 'Регистрация в ФНС и Честный ЗНАК',      hint: 'Перерегистрация ККТ (если нужно), интеграция с ГИС МТ' },
  { id: 'e_test',     label: 'Тестовые операции',                     hint: 'Тестовая продажа + возврат маркированного товара, проверка кода в чеке' },
  { id: 'e_handover', label: 'Сдача клиенту и обучение',              hint: 'Обучить персонал, подписать акт, передать менеджеру' },
];

// ════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════
let state = {
  authed: false,
  orders: [],
  columns: [],
  expanded: new Set(),
  filter: '',
  statusFilter: '',
  loading: false,
  captchaToken: '',
  captchaQuestion: '',
};

// ════════════════════════════════════════════════════════════════
// API
// ════════════════════════════════════════════════════════════════
async function api(path, opts = {}) {
  const r = await fetch(API_BASE + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(opts.headers||{}) },
    credentials: 'same-origin',
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

async function loadCaptcha() {
  const d = await api('/captcha');
  state.captchaToken = d.token;
  state.captchaQuestion = d.question;
}

async function login(login, password, captchaAnswer) {
  return api('/admin/auth', {
    method: 'POST',
    body: JSON.stringify({ login, password, captchaToken: state.captchaToken, captchaAnswer }),
  });
}

async function logout() {
  try { await api('/admin/auth', { method: 'DELETE' }); } catch {}
  state.authed = false;
  state.orders = [];
  state.expanded.clear();
  render();
}

async function loadOrders() {
  state.loading = true;
  try {
    const d = await api('/admin/orders');
    state.orders = d.orders || [];
    state.columns = d.columns || [];
    state.loading = false;
  } catch (e) {
    state.loading = false;
    if (e.message.includes('Unauthorized') || e.message.includes('AUTH_REQUIRED')) {
      state.authed = false;
      render();
      return;
    }
    toast('Ошибка загрузки: ' + e.message, 'error');
  }
  render();
}

async function patchOrder(rowIndex, updates, opts = {}) {
  const { silent = false, skipRender = false } = opts;
  try {
    await api('/admin/orders', {
      method: 'PATCH',
      body: JSON.stringify({ rowIndex, updates }),
    });
    if (!silent) toast('Сохранено', 'success');
    // Обновляем локально
    const o = state.orders.find(x => x._rowIndex === rowIndex);
    if (o) Object.assign(o, updates);
    if (!skipRender) render();
  } catch (e) {
    toast('Ошибка: ' + e.message, 'error');
  }
}

// ════════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════════
function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.classList.remove('show'), 2500);
}

function fmtTotal(v) {
  const n = parseFloat(String(v||'').replace(/\s/g,'').replace(',','.'));
  if (!n) return '—';
  return n.toLocaleString('ru-RU') + ' ₽';
}

function getCol(o, names) {
  for (const n of names) {
    for (const key of Object.keys(o)) {
      if (key.toLowerCase().includes(n.toLowerCase())) return o[key];
    }
  }
  return '';
}

function getOrderData(o) {
  return {
    date:    getCol(o, ['Дата', 'Timestamp', 'Время']),
    num:     getCol(o, ['Заказ', 'orderNum', '№']),
    client:  getCol(o, ['Клиент', 'clientName', 'Имя']),
    phone:   getCol(o, ['Телефон', 'phone']),
    email:   getCol(o, ['Email']),
    kkm:     getCol(o, ['ККМ', 'kkmType', 'Модель']),
    cond:    getCol(o, ['Состояние', 'kkmCondition', 'Сост']),
    services:getCol(o, ['Услуги', 'services', 'Работы']),
    total:   getCol(o, ['Сумма', 'total']),
    comment: getCol(o, ['Комментарий', 'comment']) ,
    status:  getCol(o, ['Статус', 'Status']),
    note:    getCol(o, ['Комментарий менеджера', 'AdminComment', 'managerNote']),
    file:    getCol(o, ['Файл заказа', 'file']),
    // Если есть закэшированное значение из toggleCheck — используем его, иначе парсим из колонки
    managerChecklist:    o._managerChecklist !== undefined
                          ? parseChecklist(o._managerChecklist)
                          : parseChecklist(getCol(o, ['Чек-лист менеджера'])),
    engineerChecklist:   o._engineerChecklist !== undefined
                          ? parseChecklist(o._engineerChecklist)
                          : parseChecklist(getCol(o, ['Чек-лист инженера'])),
    rowIndex:o._rowIndex,
  };
}

// Чек-листы хранятся в Sheets как JSON-массив id отмеченных пунктов:
// ["m_fn_sale","m_ofd_sale"] → Set(["m_fn_sale","m_ofd_sale"])
function parseChecklist(raw) {
  if (!raw) return new Set();
  try {
    const arr = JSON.parse(raw);
    if (Array.isArray(arr)) return new Set(arr);
  } catch {}
  // Запасной вариант: разделённые запятой
  const parts = String(raw).split(',').map(s => s.trim()).filter(Boolean);
  return new Set(parts);
}

function checklistToJSON(set) {
  return JSON.stringify(Array.from(set).sort());
}

function condLabel(c) {
  if (!c) return '';
  const m = { 'new': 'Новая', 'old': 'Б/у', 'Новая': 'Новая', 'Б/у': 'Б/у' };
  return m[c] || c;
}

// ════════════════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════════════════
function render() {
  const app = document.getElementById('app');
  if (!state.authed) {
    renderLogin(app);
    return;
  }
  renderMain(app);
}

function renderLogin(root) {
  root.innerHTML = `
    <div class="login-screen">
      <div class="login-box">
        <h1>CRM kassa-cto.ru</h1>
        <p>Вход для менеджеров</p>
        <div id="loginForm">
          <label>Логин</label>
          <input id="li_login" type="text" autocomplete="username" placeholder="tellur">
          <label>Пароль</label>
          <input id="li_pass" type="password" autocomplete="current-password" placeholder="••••••••">
          <label>Капча: <span class="captcha" id="li_captcha">${state.captchaQuestion || 'загрузка...'}</span></label>
          <input id="li_cap_ans" type="text" inputmode="numeric" placeholder="Ответ">
          <button id="li_btn" onclick="doLogin()">Войти</button>
          <div id="li_err" class="login-error"></div>
        </div>
      </div>
    </div>
  `;
}

async function doLogin() {
  const l = document.getElementById('li_login').value.trim();
  const p = document.getElementById('li_pass').value;
  const a = document.getElementById('li_cap_ans').value.trim();
  const err = document.getElementById('li_err');
  const btn = document.getElementById('li_btn');
  btn.disabled = true; btn.textContent = 'Вход...';
  err.textContent = '';
  try {
    await login(l, p, a);
    state.authed = true;
    await loadOrders();
  } catch (e) {
    err.textContent = e.message;
    await loadCaptcha();
    render();
  } finally {
    btn.disabled = false; btn.textContent = 'Войти';
  }
}

function renderMain(root) {
  const filtered = state.orders.filter(o => {
    const d = getOrderData(o);
    const text = `${d.num} ${d.client} ${d.phone} ${d.email} ${d.kkm} ${d.services} ${d.comment}`.toLowerCase();
    const matchText = !state.filter || text.includes(state.filter.toLowerCase());
    const matchStatus = !state.statusFilter || d.status === state.statusFilter;
    return matchText && matchStatus;
  });

  // Статистика
  const stats = { new:0, inProgress:0, done:0, total:0, sum:0 };
  state.orders.forEach(o => {
    const d = getOrderData(o);
    stats.total++;
    const s = (d.status||'Новый').toLowerCase();
    if (s === 'новый' || !s) stats.new++;
    else if (s.includes('работ')) stats.inProgress++;
    else if (s.includes('готов') || s.includes('закрыт')) stats.done++;
    const t = parseFloat(String(d.total).replace(/\s/g,'').replace(',','.'));
    if (t) stats.sum += t;
  });

  root.innerHTML = `
    <header>
      <div class="header-inner">
        <a href="/" class="brand" title="На главную">
          <img src="/logo.webp" alt="Теллур-Интех" onerror="this.style.display='none'">
          <span class="brand-text">
            <strong>Теллур-Интех</strong>
            <small>CRM</small>
          </span>
        </a>
        <div class="actions">
          <button onclick="loadOrders()" title="Обновить список заказов">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
            <span class="btn-label">Обновить</span>
          </button>
          <a href="/" class="btn-link" title="Открыть сайт kassa-cto.ru">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
            <span class="btn-label">Сайт</span>
          </a>
          <button onclick="logout()" title="Выйти из CRM" style="background: rgba(220,38,38,.2); border-color: rgba(220,38,38,.3);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            <span class="btn-label">Выйти</span>
          </button>
        </div>
      </div>
    </header>
    <div class="filters">
      <input id="filter_input" placeholder="🔍 Поиск: имя, телефон, касса, услуги..." value="${state.filter.replace(/"/g,'&quot;')}" oninput="state.filter=this.value; renderList()">
      <select id="status_filter" onchange="state.statusFilter=this.value; renderList()">
        <option value="">Все статусы</option>
        <option value="Новый" ${state.statusFilter==='Новый'?'selected':''}>Новый</option>
        <option value="В работе" ${state.statusFilter==='В работе'?'selected':''}>В работе</option>
        <option value="Ожидает" ${state.statusFilter==='Ожидает'?'selected':''}>Ожидает</option>
        <option value="Готово" ${state.statusFilter==='Готово'?'selected':''}>Готово</option>
        <option value="Закрыт" ${state.statusFilter==='Закрыт'?'selected':''}>Закрыт</option>
        <option value="Отказ" ${state.statusFilter==='Отказ'?'selected':''}>Отказ</option>
      </select>
    </div>
    <main>
      <div class="stats">
        <div class="stat"><div class="label">Всего</div><div class="value">${stats.total}</div></div>
        <div class="stat info"><div class="label">Новые</div><div class="value">${stats.new}</div></div>
        <div class="stat warning"><div class="label">В работе</div><div class="value">${stats.inProgress}</div></div>
        <div class="stat success"><div class="label">Готово/Закрыто</div><div class="value">${stats.done}</div></div>
        <div class="stat"><div class="label">Сумма</div><div class="value">${stats.sum.toLocaleString('ru-RU')} ₽</div></div>
      </div>
      <div id="orders_container"></div>
    </main>
  `;
  renderList(filtered);
}

function renderList(orders) {
  if (orders === undefined) {
    // Перерисовать отфильтрованный список
    const filtered = state.orders.filter(o => {
      const d = getOrderData(o);
      const text = `${d.num} ${d.client} ${d.phone} ${d.email} ${d.kkm} ${d.services} ${d.comment}`.toLowerCase();
      const matchText = !state.filter || text.includes(state.filter.toLowerCase());
      const matchStatus = !state.statusFilter || d.status === state.statusFilter;
      return matchText && matchStatus;
    });
    orders = filtered;
  }
  const container = document.getElementById('orders_container');
  if (!container) return;

  if (state.loading) {
    container.innerHTML = `<div class="loading"><div class="spinner"></div><p>Загрузка...</p></div>`;
    return;
  }

  if (orders.length === 0) {
    container.innerHTML = `
      <div class="empty">
        <h2>Заказов нет</h2>
        <p>Новые заявки с сайта появятся здесь автоматически</p>
      </div>`;
    return;
  }

  container.innerHTML = `<div class="orders-list">` + orders.map(o => renderOrder(o)).join('') + `</div>`;
}

function renderOrder(o) {
  const d = getOrderData(o);
  const isExpanded = state.expanded.has(d.rowIndex);
  const services = (d.services || '').split(', ').filter(Boolean);

  // Превью услуг для списка — короткие чипы, не больше 3 + "+N ещё"
  const previewServices = services.slice(0, 3);
  const moreCount = services.length - previewServices.length;

  return `
    <div class="order ${isExpanded?'expanded':''}" id="order_${d.rowIndex}">
      <div class="order-header" onclick="toggleOrder(${d.rowIndex})">
        <div class="order-num">#${d.num || '—'}</div>
        <div class="order-client">
          ${escapeHtml(d.client || 'Без имени')}
          <small>${escapeHtml(d.phone || '')} · ${escapeHtml(d.date || '')}</small>
          ${services.length ? `
            <div class="order-services-preview">
              ${previewServices.map(s => `<span class="service-chip">${escapeHtml(s)}</span>`).join('')}
              ${moreCount > 0 ? `<span class="service-more">+${moreCount} ещё</span>` : ''}
            </div>
          ` : ''}
          <div class="order-mobile-meta">
            <span class="order-status-mobile status-${escapeHtml(d.status || 'Новый')}">${escapeHtml(d.status || 'Новый')}</span>
            ${d.kkm ? `<span class="order-mobile-kkm">${escapeHtml(d.kkm)}</span>` : ''}
            <span class="order-mobile-total">${fmtTotal(d.total)}</span>
          </div>
        </div>
        <div class="order-kkm">
          ${escapeHtml(d.kkm || '—')}
          <small>${escapeHtml(condLabel(d.cond))}</small>
        </div>
        <div class="order-total">${fmtTotal(d.total)}</div>
        <div><span class="order-status status-${escapeHtml(d.status || 'Новый')}">${escapeHtml(d.status || 'Новый')}</span></div>
        <div class="order-toggle">▶</div>
      </div>
      <div class="order-details">
        ${renderServicesBlock(d, services)}
        <div class="details-grid">
          ${renderManagerPanel(d, services)}
        </div>
        <div class="actions-row">
          <input class="note-input" id="note_${d.rowIndex}" placeholder="Комментарий менеджера..." value="${escapeHtml(d.note||'')}">
          <button class="btn primary" onclick="saveNote(${d.rowIndex})">💾 Сохранить</button>
          <a class="btn" href="tel:${(d.phone||'').replace(/\D/g,'')}">📞 Позвонить</a>
          ${d.email ? `<a class="btn" href="mailto:${escapeHtml(d.email)}">✉️ Письмо</a>` : ''}
          <button class="btn" onclick="copyOrder(${d.rowIndex})">📋 Копировать</button>
        </div>
        ${renderEngineerPanel(d, services)}
      </div>
    </div>
  `;
}

// ─── Воронка статусов: Новый → В работе → Ожидает → Готово → Закрыт ───
const FUNNEL_STATUSES = [
  { value: 'Новый',    label: 'Новый',    icon: '📌' },
  { value: 'В работе', label: 'В работе', icon: '🔧' },
  { value: 'Ожидает',  label: 'Ожидает',  icon: '⏳' },
  { value: 'Готово',   label: 'Готово',   icon: '✅' },
  { value: 'Закрыт',   label: 'Закрыт',   icon: '📦' },
];
const REJECTED_STATUS = 'Отказ';

// ─── Блок услуг — отдельная секция, не привязанная к менеджеру/инженеру ───
function renderServicesBlock(d, services) {
  if (!services || services.length === 0) return '';
  return `
    <div class="services-block">
      <h3>
        <span>📋 Услуги в заказе</span>
        <span class="count">${services.length} ${services.length === 1 ? 'услуга' : (services.length < 5 ? 'услуги' : 'услуг')}</span>
      </h3>
      <div class="body">
        <ul class="services-list">
          ${services.map(s => `<li>${escapeHtml(s)}</li>`).join('')}
        </ul>
      </div>
    </div>
  `;
}

function renderFunnel(d) {
  const currentStatus = d.status || 'Новый';
  const isRejected = currentStatus === REJECTED_STATUS;
  const currentIdx = FUNNEL_STATUSES.findIndex(s => s.value === currentStatus);

  return `
    <div style="padding:14px 18px 0">
      <div class="funnel-label">Воронка статусов</div>
      <div class="funnel">
        ${FUNNEL_STATUSES.map((s, idx) => {
          let cls = 'funnel-step';
          if (isRejected) {
            // Если отказ — все шаги серые
          } else if (idx < currentIdx) {
            cls += ' done';
          } else if (idx === currentIdx) {
            cls += ' active';
          }
          return `<div class="${cls}" onclick="setStatus(${d.rowIndex}, '${s.value}')" title="Установить статус: ${s.label}">
            ${s.icon} ${s.label}
          </div>`;
        }).join('<span class="funnel-arrow">→</span>')}
        <span style="flex:1"></span>
        <div class="funnel-step ${isRejected?'rejected':''}" onclick="setStatus(${d.rowIndex}, '${REJECTED_STATUS}')" title="Отметить как отказ" style="${isRejected?'':'color:#dc2626;border-color:#fca5a5'}">
          ❌ Отказ
        </div>
      </div>
    </div>
  `;
}

function setStatus(rowIndex, status) {
  patchOrder(rowIndex, { 'Статус': status });
}

  const checkedSet = d.managerChecklist || new Set();
  return `
    <div class="panel manager">
      <h3>👤 Менеджер — воронка работы с заявкой</h3>
      <div class="body">
        <div class="kv" style="margin-bottom:14px">
          <div class="k">№ заказа</div><div class="v">${escapeHtml(d.num||'—')}</div>
          <div class="k">Дата</div><div class="v">${escapeHtml(d.date||'—')}</div>
          <div class="k">Клиент</div><div class="v">${escapeHtml(d.client||'—')}</div>
          <div class="k">Телефон</div><div class="v"><a href="tel:${(d.phone||'').replace(/\D/g,'')}">${escapeHtml(d.phone||'—')}</a></div>
          <div class="k">Email</div><div class="v">${d.email ? `<a href="mailto:${escapeHtml(d.email)}">${escapeHtml(d.email)}</a>` : '—'}</div>
          <div class="k">Сумма</div><div class="v"><b>${fmtTotal(d.total)}</b></div>
          <div class="k">Комментарий клиента</div><div class="v">${escapeHtml(d.comment||'—')}</div>
        </div>
        <div class="funnel-label" style="margin-top:6px">Воронка менеджера (отметка этапа = статус)</div>
        <ul class="checklist funnel-checklist">
          ${MANAGER_CHECKLIST.map((item, idx) => {
            const checked = checkedSet.has(item.id);
            const current = (d.status || 'Новый') === item.status;
            const cls = checked ? 'done' : (current ? 'current' : '');
            return `
            <li data-row="${d.rowIndex}" data-check="${item.id}" data-list="manager" class="${cls}">
              <input type="checkbox" id="m_${item.id}_${d.rowIndex}" ${checked?'checked':''} onchange="toggleCheck(${d.rowIndex}, '${item.id}', 'manager', this.checked)">
              <div class="check-label" onclick="document.getElementById('m_${item.id}_${d.rowIndex}').click()">
                <div class="funnel-step-title">${item.icon} ${escapeHtml(item.label)} <span class="funnel-status-badge ${current?'current':''}">→ ${escapeHtml(item.status)}</span></div>
                ${item.hint ? `<small>${escapeHtml(item.hint)}</small>` : ''}
              </div>
            </li>`;
          }).join('')}
        </ul>
        <div style="margin-top:10px;padding:8px 10px;background:#fef3c7;border-radius:6px;border-left:3px solid #f59e0b;font-size:11px;color:#92400e">
          ⚠️ Отметка этапа автоматически меняет статус заказа. Снятие галочки откатывает статус назад.
        </div>
        <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
          <button class="btn danger" onclick="setStatus(${d.rowIndex}, 'Отказ')" style="font-size:12px;padding:6px 12px">❌ Отметить как отказ</button>
        </div>
      </div>
    </div>
  `;
}

function renderEngineerPanel(d, services) {
  const checkedSet = d.engineerChecklist || new Set();
  const doneCount = ENGINEER_CHECKLIST.filter(item => checkedSet.has(item.id)).length;
  const totalCount = ENGINEER_CHECKLIST.length;
  // Сворачиваемая панель — по умолчанию свёрнута. ID нужен для toggle.
  const panelId = `eng_${d.rowIndex}`;
  return `
    <div class="panel engineer">
      <div class="collapsible" id="${panelId}">
        <div class="collapsible-toggle" onclick="toggleEngineer('${panelId}')">
          <span>🔧 Инженер — технические работы ${doneCount>0 ? `<span style="opacity:.8;font-weight:400">(${doneCount}/${totalCount})</span>` : ''}</span>
          <span class="toggle-icon">▼</span>
        </div>
        <div class="collapsible-content">
          <div class="body">
            <div class="kv" style="margin-bottom:14px">
              <div class="k">Модель ККМ</div><div class="v"><b>${escapeHtml(d.kkm||'—')}</b></div>
              <div class="k">Состояние</div><div class="v">${escapeHtml(condLabel(d.cond))}</div>
            </div>
            <ul class="checklist">
              ${ENGINEER_CHECKLIST.map(item => {
                const checked = checkedSet.has(item.id);
                return `
                <li data-row="${d.rowIndex}" data-check="${item.id}" data-list="engineer" class="${checked?'done':''}">
                  <input type="checkbox" id="e_${item.id}_${d.rowIndex}" ${checked?'checked':''} onchange="toggleCheck(${d.rowIndex}, '${item.id}', 'engineer', this.checked)">
                  <div class="check-label" onclick="document.getElementById('e_${item.id}_${d.rowIndex}').click()">
                    ${escapeHtml(item.label)}
                    ${item.hint ? `<small>${escapeHtml(item.hint)}</small>` : ''}
                  </div>
                </li>`;
              }).join('')}
            </ul>
            <div style="margin-top:10px;font-size:11px;color:#92400e;padding:8px 10px;background:#fef3c7;border-radius:6px;border-left:3px solid #f59e0b">
              ⚠️ Перед выездом уточнить наличие ФН нужного типа и актуальность ПО кассы
            </div>
            <div style="margin-top:8px;font-size:11px;color:var(--text-soft)">
              Отмеченные пункты сохраняются в Google Sheets автоматически
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function toggleEngineer(panelId) {
  const el = document.getElementById(panelId);
  if (el) el.classList.toggle('expanded');
}

function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ════════════════════════════════════════════════════════════════
// ACTIONS
// ════════════════════════════════════════════════════════════════
function toggleOrder(rowIndex) {
  if (state.expanded.has(rowIndex)) state.expanded.delete(rowIndex);
  else state.expanded.add(rowIndex);
  const el = document.getElementById('order_' + rowIndex);
  if (el) el.classList.toggle('expanded');
}

// Переключение чекбокса с сохранением в Google Sheets
// rowIndex — строка заказа
// checkId  — id пункта (m_new / e_kkm_check / ...)
// listType — 'manager' или 'engineer'
// checked  — новое состояние (true/false)
//
// Для менеджера: отметка этапа автоматически меняет статус заказа
// (привязка к воронке). Снятие — откатывает статус назад.
function toggleCheck(rowIndex, checkId, listType, checked) {
  const order = state.orders.find(o => o._rowIndex === rowIndex);
  if (!order) return;
  const d = getOrderData(order);
  const set = (listType === 'manager') ? d.managerChecklist : d.engineerChecklist;
  if (checked) set.add(checkId);
  else set.delete(checkId);

  // Записываем обратно в заказ (чтобы при перерисовке не слетало)
  if (listType === 'manager') {
    order._managerChecklist = checklistToJSON(set);
  } else {
    order._engineerChecklist = checklistToJSON(set);
  }

  // Готовим PATCH-обновление
  const updates = {};
  const colName = (listType === 'manager') ? 'Чек-лист менеджера' : 'Чек-лист инженера';
  updates[colName] = checklistToJSON(set);

  // ─── Для менеджера: синхронизируем статус с воронкой ───────────
  if (listType === 'manager') {
    const item = MANAGER_CHECKLIST.find(x => x.id === checkId);
    if (!item) return;

    if (checked) {
      // Отметили этап → статус = этому этапу
      updates['Статус'] = item.status;
      order['Статус'] = item.status; // обновляем локально
      // Также помечаем все предыдущие этапы как выполненные
      const idx = MANAGER_CHECKLIST.findIndex(x => x.id === checkId);
      for (let i = 0; i < idx; i++) {
        set.add(MANAGER_CHECKLIST[i].id);
      }
      updates[colName] = checklistToJSON(set);
      order._managerChecklist = checklistToJSON(set);
      toast(`Этап «${item.label}» → статус «${item.status}»`, 'success');
    } else {
      // Сняли галочку → откатываем статус на предыдущий этап
      const idx = MANAGER_CHECKLIST.findIndex(x => x.id === checkId);
      // Снимаем все последующие этапы
      for (let i = idx; i < MANAGER_CHECKLIST.length; i++) {
        set.delete(MANAGER_CHECKLIST[i].id);
      }
      updates[colName] = checklistToJSON(set);
      order._managerChecklist = checklistToJSON(set);
      // Новый статус = последний отмеченный этап, или 'Новый' если ничего не отмечено
      const lastChecked = MANAGER_CHECKLIST.filter(x => set.has(x.id)).pop();
      const newStatus = lastChecked ? lastChecked.status : 'Новый';
      updates['Статус'] = newStatus;
      order['Статус'] = newStatus;
      toast(`Статус откатился на «${newStatus}»`, 'success');
    }
    // Перерисовываем карточку чтобы обновилась воронка
    renderList();
    patchOrder(rowIndex, updates, { silent: true, skipRender: true });
    return;
  }

  // ─── Для инженера: просто сохраняем чек-лист ──────────────────
  patchOrder(rowIndex, updates, { silent: true, skipRender: true });
}

function saveNote(rowIndex) {
  const input = document.getElementById('note_' + rowIndex);
  if (!input) return;
  patchOrder(rowIndex, { 'Комментарий менеджера': input.value });
}

function copyOrder(rowIndex) {
  const o = state.orders.find(x => x._rowIndex === rowIndex);
  if (!o) return;
  const d = getOrderData(o);
  const text = `Заказ #${d.num}
Клиент: ${d.client}
Телефон: ${d.phone}
Email: ${d.email || '—'}
ККМ: ${d.kkm} (${condLabel(d.cond)})
Услуги: ${d.services}
Сумма: ${fmtTotal(d.total)}
Комментарий: ${d.comment || '—'}
Статус: ${d.status || 'Новый'}`;
  navigator.clipboard.writeText(text).then(() => toast('Скопировано в буфер', 'success'));
}

// ════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════
async function init() {
  // Проверяем, авторизованы ли (cookie admin_jwt)
  try {
    await api('/admin/orders');
    state.authed = true;
    await loadOrders();
  } catch (e) {
    state.authed = false;
    await loadCaptcha();
    render();
  }
}

init();
</script>
